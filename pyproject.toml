[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vtla-grip"
version = "0.1.0"
description = "RealSense D435 to RM65 visual positioning pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<5",
  "pyserial>=3.5,<4",
  "pyrealsense2>=2.56,<3",
  "uvicorn[standard]>=0.35,<1",
  "xgboost>=2.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
vtla-camera = "vtla_grip.camera_app:main"
vtla-calibrate = "vtla_grip.calibration_app:main"
vtla-solve-calibration = "vtla_grip.calibration_solver:main"
vtla-api = "vtla_grip.web.app:main"
vtla-robot = "vtla_grip.robot_client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vtla_grip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
